name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Both SDKs are required. 11.0.x compiles the net11.0 targets; 10.0.x is needed for its
      # *runtime* — the net10.0 test executables will not start on an 11.x-only runtime, because
      # framework roll-forward never crosses a major version.
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x
            11.0.x
          dotnet-quality: "preview"
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - run: dotnet restore

      - run: dotnet build --no-restore -c Release

      - run: dotnet test --no-build -c Release
